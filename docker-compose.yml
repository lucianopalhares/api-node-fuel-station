services:
  api:
    build: ./api
    ports:
      - "3261:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-ipdv}
      DB_USER: ${POSTGRES_USER:-ipdv}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ipdv}
    depends_on:
      - db

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ipdv}
      POSTGRES_USER: ${POSTGRES_USER:-ipdv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ipdv}
    ports:
      - "5418:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
