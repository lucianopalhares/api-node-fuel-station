services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    ports:
      - "3261:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-ipdv}
      DB_USER: ${POSTGRES_USER:-ipdv}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ipdv}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: imports
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
    depends_on:
      - db
      - minio
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ipdv}
      POSTGRES_USER: ${POSTGRES_USER:-ipdv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ipdv}
    ports:
      - "5418:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./api/sql:/docker-entrypoint-initdb.d:ro

  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
  api_node_modules:
