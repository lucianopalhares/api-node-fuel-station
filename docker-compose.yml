services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    ports:
      - "3261:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-ipdv}
      DB_USER: ${POSTGRES_USER:-ipdv}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ipdv}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: imports
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      RABBITMQ_URL: amqp://ipdv:ipdv@rabbitmq:5672
      RABBITMQ_IMPORT_QUEUE: imports
      OBSERVABILITY_SERVICE: ipdv-api
    depends_on:
      - db
      - minio
      - rabbitmq
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules
    labels:
      com.ipdv.observability: "true"

  front:
    build:
      context: ./front
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://api:3000
      VITE_QUEUE_URL: ${VITE_QUEUE_URL:-http://localhost:15673}
      VITE_OBSERVABILITY_URL: ${VITE_OBSERVABILITY_URL:-http://localhost:9999}
    depends_on:
      - api
    volumes:
      - ./front:/app
      - front_node_modules:/app/node_modules
    labels:
      com.ipdv.observability: "true"

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ipdv}
      POSTGRES_USER: ${POSTGRES_USER:-ipdv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ipdv}
    ports:
      - "5418:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./api/sql:/docker-entrypoint-initdb.d:ro
    labels:
      com.ipdv.observability: "true"

  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    labels:
      com.ipdv.observability: "true"

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    command: sh -c "npm install && npm run worker"
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-ipdv}
      DB_USER: ${POSTGRES_USER:-ipdv}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ipdv}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: imports
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      RABBITMQ_URL: amqp://ipdv:ipdv@rabbitmq:5672
      RABBITMQ_IMPORT_QUEUE: imports
      OBSERVABILITY_SERVICE: ipdv-worker
    depends_on:
      - db
      - minio
      - rabbitmq
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules
    labels:
      com.ipdv.observability: "true"

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ipdv
      RABBITMQ_DEFAULT_PASS: ipdv
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    labels:
      com.ipdv.observability: "true"

  observability:
    image: amir20/dozzle:latest
    ports:
      - "9999:8080"
    environment:
      DOZZLE_FILTER: label=com.ipdv.observability=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dozzle_data:/data

volumes:
  postgres_data:
  minio_data:
  api_node_modules:
  rabbitmq_data:
  dozzle_data:
  front_node_modules:
